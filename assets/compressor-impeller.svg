<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="hub" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#12a06e"/>
      <stop offset="100%" stop-color="#0a6b49"/>
    </radialGradient>
    <!-- Una pala (vane) backswept: viene ruotata attorno al centro -->
    <path id="blade" d="M100,66 C113,52 129,45 145,41"
          stroke="#0a6b49" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </defs>

  <!-- Anelli esterni (shroud) -->
  <circle cx="100" cy="100" r="88" stroke="#0a6b49" stroke-width="2" opacity="0.14"/>
  <circle cx="100" cy="100" r="79" stroke="#12a06e" stroke-width="1.5" opacity="0.22"/>

  <!-- 12 pale ruotate -->
  <use href="#blade" transform="rotate(0 100 100)"/>
  <use href="#blade" transform="rotate(30 100 100)"/>
  <use href="#blade" transform="rotate(60 100 100)"/>
  <use href="#blade" transform="rotate(90 100 100)"/>
  <use href="#blade" transform="rotate(120 100 100)"/>
  <use href="#blade" transform="rotate(150 100 100)"/>
  <use href="#blade" transform="rotate(180 100 100)"/>
  <use href="#blade" transform="rotate(210 100 100)"/>
  <use href="#blade" transform="rotate(240 100 100)"/>
  <use href="#blade" transform="rotate(270 100 100)"/>
  <use href="#blade" transform="rotate(300 100 100)"/>
  <use href="#blade" transform="rotate(330 100 100)"/>

  <!-- Mozzo (hub) -->
  <circle cx="100" cy="100" r="30" fill="url(#hub)" opacity="0.92"/>
  <circle cx="100" cy="100" r="30" stroke="#0a6b49" stroke-width="1.5" opacity="0.45"/>
  <circle cx="100" cy="100" r="10" fill="#f4f7f6" opacity="0.9"/>
  <circle cx="100" cy="100" r="3.5" fill="#0a6b49" opacity="0.7"/>
</svg>
