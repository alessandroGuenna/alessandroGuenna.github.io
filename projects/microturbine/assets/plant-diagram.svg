<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Inter, system-ui, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="640" fill="#ffffff"/>

  <g stroke="#1a1a1a" fill="none" stroke-width="2.4" stroke-linejoin="round">
    <!-- Compressor (converging) -->
    <polygon points="300,95 445,150 445,230 300,285" fill="#ffffff"/>
    <!-- Turbine (diverging) -->
    <polygon points="590,150 735,95 735,285 590,230" fill="#ffffff"/>
    <!-- Shaft -->
    <line x1="445" y1="190" x2="590" y2="190" stroke-width="6"/>
    <line x1="735" y1="190" x2="797" y2="190" stroke-width="6"/>
    <!-- Generator -->
    <circle cx="843" cy="190" r="48" fill="#ffffff"/>
    <path d="M814,190 C822,166 830,166 838,190 S854,214 862,190" stroke-width="2.4"/>
    <!-- CC -->
    <rect x="545" y="274" width="100" height="72" fill="#ffffff"/>
    <!-- Recuperator -->
    <rect x="360" y="430" width="420" height="110" fill="#ffffff"/>
    <polyline points="392,522 452,448 512,522 572,448 632,522 692,448 750,522" stroke-width="2"/>
    <!-- HRB -->
    <rect x="120" y="430" width="180" height="110" fill="#ffffff"/>
    <polyline points="150,520 190,452 230,520 270,452 296,508" stroke-width="2"/>
  </g>

  <!-- Flow arrows -->
  <g stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ah)">
    <line x1="150" y1="190" x2="292" y2="190"/>            <!-- Air (1) -->
    <line x1="372" y1="260" x2="372" y2="425"/>            <!-- 2 -->
    <line x1="662" y1="257" x2="662" y2="425"/>            <!-- 5 -->
    <line x1="595" y1="428" x2="595" y2="348"/>            <!-- 3 -->
    <line x1="595" y1="272" x2="595" y2="238"/>            <!-- 4 -->
    <line x1="470" y1="310" x2="543" y2="310"/>            <!-- Fuel -->
    <line x1="358" y1="485" x2="303" y2="485"/>            <!-- 6 -->
    <line x1="118" y1="485" x2="44" y2="485"/>             <!-- Exhaust (7) -->
    <line x1="160" y1="600" x2="160" y2="542"/>            <!-- Water in (8) -->
    <line x1="256" y1="542" x2="256" y2="600"/>            <!-- Water out (9) -->
    <line x1="843" y1="240" x2="843" y2="300"/>            <!-- Electricity -->
  </g>

  <!-- Component labels -->
  <g fill="#1a1a1a" font-size="22" text-anchor="middle">
    <text x="372" y="70">Compressor</text>
    <text x="662" y="70">Turbine</text>
    <text x="843" y="116">Generator</text>
    <text x="225" y="168">Air</text>
    <text x="595" y="316" font-size="21">CC</text>
    <text x="570" y="562">Recuperator</text>
    <text x="210" y="418">HRB</text>
    <text x="843" y="326">Electricity</text>
    <text x="160" y="622" font-size="20">Water in</text>
    <text x="256" y="622" font-size="20">Water out</text>
  </g>
  <text x="462" y="315" fill="#1a1a1a" font-size="22" text-anchor="end">Fuel</text>
  <text x="114" y="470" fill="#1a1a1a" font-size="20" text-anchor="end">Exhaust gas</text>

  <!-- Stream numbers (bold) -->
  <g fill="#1a1a1a" font-size="23" font-weight="700" text-anchor="middle">
    <text x="225" y="216">1</text>
    <text x="392" y="356">2</text>
    <text x="614" y="392">3</text>
    <text x="573" y="256">4</text>
    <text x="684" y="356">5</text>
    <text x="332" y="470">6</text>
    <text x="78" y="512">7</text>
    <text x="178" y="576">8</text>
    <text x="238" y="576">9</text>
  </g>
</svg>
